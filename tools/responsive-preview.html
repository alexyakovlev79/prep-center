<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="robots" content="noindex,nofollow"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Проверка адаптивности</title><style>body{margin:0;background:#dde0e5;font:16px Arial}main{padding:18px 24px}p{margin:0 0 12px}iframe{display:block;height:844px;border:0;background:white;box-shadow:0 3px 20px #0003}</style></head><body><main><p id="label"></p><iframe title="Проверка страницы Преп-Центра"></iframe></main><script>const params=new URLSearchParams(location.search),width=Math.min(1920,Math.max(320,Number(params.get('width'))||390)),path=params.get('page')||'/';document.getElementById('label').textContent='Ширина страницы: '+width+' px';const frame=document.querySelector('iframe');frame.style.width=width+'px';frame.src=path.startsWith('/')&&!path.startsWith('//')?path:'/';</script></body></html>
