name: Check public exposure of restoration snapshots
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/seo-archive-probe.yml'
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Probe archived HTML exposure
        run: |
          for url in 'https://prep-center.ru/restoration/source/home-20260822.html' 'https://prep-center.ru/restoration/source/next-ten/about-20260822.html' 'https://prep-center.ru/tools/responsive-preview.html' ; do
            printf '%s ' "$url"
            curl -LsS -o /dev/null -w 'HTTP %{http_code}\n' --max-time 20 "$url" || true
          done
