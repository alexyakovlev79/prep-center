name: Site-wide SEO audit
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/seo-site-audit.yml'
      - 'scripts/seo_audit.py'
permissions:
  contents: write
concurrency:
  group: prep-center-seo-audit
  cancel-in-progress: false
jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install beautifulsoup4==4.13.4
      - name: Audit canonical SEO, sitemap and headings of 45 pages
        run: python scripts/seo_audit.py
      - name: Commit baseline report
        run: |
          git add reports/seo-audit-before-20261112.json reports/seo-audit-before-20261112.md
          if ! git diff --cached --quiet; then
            git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'Record baseline 45-page SEO audit before fixes'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
