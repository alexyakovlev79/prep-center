name: Live SEO smoke test for 45 published pages
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/seo-live-verify.yml'
permissions:
  contents: read
jobs:
  live:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install beautifulsoup4==4.13.4
      - name: Confirm live 45/45 pages, sitemap, robots and fresh metadata
        run: |
          python - <<'PY'
          import concurrent.futures
          import json
          import time
          import urllib.request
          import urllib.error
          import xml.etree.ElementTree as ET
          from bs4 import BeautifulSoup

          base='https://prep-center.ru'
          report=json.load(open('reports/seo-audit-after-20261112.json'))
          assert len(report['pages'])==45
          def get(url, seconds=20):
              req=urllib.request.Request(url,headers={
                  'User-Agent':'Mozilla/5.0 (compatible; PrepCenterSEOAudit/1.0)',
                  'Cache-Control':'no-cache','Pragma':'no-cache'})
              with urllib.request.urlopen(req,timeout=seconds) as r:
                  assert r.status==200,(url,r.status)
                  return r.read().decode('utf-8')
          expected_home=next(p for p in report['pages'] if p['route']=='/')['title']
          for attempt in range(50):
              try:
                  page=get(base+'/?seo_audit=20261112')
                  title=BeautifulSoup(page,'html.parser').title.get_text(' ',strip=True)
                  if title==expected_home:
                      print('Homepage published SEO version detected on attempt',attempt+1)
                      break
              except Exception as e:
                  print('Publication wait:',repr(e))
              time.sleep(3)
          else:
              raise AssertionError('Published homepage title not updated')
          def inspect(p):
              raw=get(p['url']+'?seo_audit=20261112')
              soup=BeautifulSoup(raw,'html.parser')
              title=soup.title.get_text(' ',strip=True) if soup.title else ''
              meta=soup.head.find('meta',attrs={'name':'description'})
              desc=meta.get('content','') if meta else ''
              canonical=soup.head.find('link',attrs={'rel':'canonical'})
              robots=soup.head.find('meta',attrs={'name':'robots'})
              h1=soup.main.find_all('h1') if soup.main else []
              assert title==p['title'],('title mismatch',p['url'],title,p['title'])
              assert desc==p['description'],('description mismatch',p['url'])
              assert canonical and canonical.get('href')==p['url'],('canonical mismatch',p['url'])
              assert robots and robots.get('content')=='index,follow',('robots mismatch',p['url'])
              assert len(h1)==1,('H1 mismatch',p['url'])
              assert h1[0].get_text(' ',strip=True)==' '.join(p['h1'][0].split()),('H1 text mismatch',p['url'])
              return p['url']
          with concurrent.futures.ThreadPoolExecutor(max_workers=6) as pool:
              res=list(pool.map(inspect,report['pages']))
          robots=get(base+'/robots.txt')
          assert 'Sitemap: '+base+'/sitemap.xml' in robots
          assert 'Disallow: /' not in robots
          sm=get(base+'/sitemap.xml')
          root=ET.fromstring(sm)
          ns='{http://www.sitemaps.org/schemas/sitemap/0.9}'
          urls=[v.text for v in root.findall('.//'+ns+'loc')]
          assert len(urls)==45 and set(urls)==set(res)
          print(json.dumps({
              'published_pages':len(res),
              'canonical_title_meta_h1':'45/45 verified on public domain',
              'robots':'OK',
              'sitemap':len(urls),
              'lastmod_dates':sorted({v.text for v in root.findall('.//'+ns+'lastmod')})
          },ensure_ascii=False,indent=2))
          PY
